{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block container_class %}narrow{% endblock %}
{% block content %}
<div class="page-head"><div><h1>Change password</h1></div></div>
<form method="post" class="card card-pad">
  {% csrf_token %}
  {% for field in form %}
  <div class="field">
    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
    {{ field }}
    {{ field.errors }}
  </div>
  {% endfor %}
  <button class="btn primary" type="submit" style="margin-top:1.25rem">Change password</button>
</form>
{% endblock %}
