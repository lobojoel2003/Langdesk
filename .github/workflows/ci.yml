name: CI

on:
  push:
    branches: ["**"]
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13"
  IMAGE: ghcr.io/${{ github.repository_owner }}/langdesk

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install "$(grep '^ruff==' requirements-dev.txt)"
      - name: Ruff lint
        run: ruff check --output-format=github .
      - name: Ruff format
        run: ruff format --check .
      - name: Entrypoint syntax
        run: sh -n docker/entrypoint.sh

  test:
    name: Test (Python ${{ matrix.python }}, ${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
        database: [postgres]
        include:
          - python: "3.13"
            database: sqlite
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: langdesk
          POSTGRES_USER: langdesk
          POSTGRES_PASSWORD: langdesk
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U langdesk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgres://langdesk:langdesk@localhost:5432/langdesk' || '' }}
      DJANGO_SETTINGS_MODULE: tests.settings
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run
      - name: Run tests
        run: >-
          pytest --cov --cov-report=term --cov-report=xml
          --junitxml=junit.xml -p no:cacheprovider
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.python }}-${{ matrix.database }}
          path: |
            junit.xml
            coverage.xml
          if-no-files-found: ignore

  deploy-check:
    name: Production settings check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: manage.py check --deploy
        env:
          DJANGO_SECRET_KEY: ${{ github.run_id }}-${{ github.run_attempt }}-ci-only-${{ github.sha }}
          LANGDESK_BASE_URL: https://langdesk.example.org
          DJANGO_ALLOWED_HOSTS: langdesk.example.org
          DJANGO_SECURE_SSL_REDIRECT: "true"
          DJANGO_SECURE_HSTS_SECONDS: "31536000"
          DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS: "true"
          DJANGO_SECURE_HSTS_PRELOAD: "true"
        run: python manage.py check --deploy --fail-level WARNING

  package:
    name: Build Python package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install build
      - run: python -m build
      - name: Check the wheel contains templates and static files
        run: |
          unzip -l dist/*.whl | grep -q "langdesk/core/templates/base.html"
          unzip -l dist/*.whl | grep -q "langdesk/core/static/langdesk/app.css"
          unzip -l dist/*.whl | grep -q "langdesk/roster/migrations/0002_languages.py"
      - uses: actions/upload-artifact@v7
        with:
          name: python-package
          path: dist/

  docker:
    name: Docker image
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Read version
        id: version
        run: echo "version=$(python3 -c 'import re;print(re.search(r"__version__ = \"(.+)\"", open("langdesk/version.py").read())[1])')" >> "$GITHUB_OUTPUT"
      - name: Build image for smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:ci
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            BUILD_NUMBER=${{ github.run_number }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test with Docker Compose
        env:
          LANGDESK_VERSION: ci
        run: |
          docker compose up -d --no-build --wait --wait-timeout 180
          curl -fsS http://localhost:8000/healthz | tee health.json
          grep -q '"status": "ok"' health.json
          grep -q '"build": "${{ github.run_number }}"' health.json
          docker compose exec -T web langdesk-entrypoint manage seed_demo --history 25
          curl -fsS -o /dev/null http://localhost:8000/accounts/login/
          docker compose exec -T web langdesk-entrypoint manage run_dispatcher
      - name: Compose logs
        if: failure()
        run: docker compose logs
      - name: Docker metadata
        if: env.PUBLISH == 'true'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=edge,branch=main
            type=sha,prefix=sha-
            type=raw,value=${{ steps.version.outputs.version }}-build.${{ github.run_number }}
      - uses: docker/setup-qemu-action@v4
        if: env.PUBLISH == 'true'
      - uses: docker/login-action@v4
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish edge image
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            BUILD_NUMBER=${{ github.run_number }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
